<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jenkins Phase 4</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background: linear-gradient(135deg, #172554, #581c87);
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 50px;
            text-align: center;
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid #c084fc;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #c084fc;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .workflow {
            margin: 30px 0;
            padding: 20px;
            color: #e9d5ff;
            background: #312e81;
            border-radius: 12px;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 12px 24px;
            color: #052e16;
            background: #4ade80;
            border-radius: 999px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Jenkins Phase 4</h1>

        <h2>GitHub Webhook Automation</h2>

        <p>
    This pipeline was triggered automatically by a GitHub push
    event and executed by Jenkins.
</p>

        <div class="workflow">
            Git Push → GitHub Webhook → Jenkins Pipeline → Validation
        </div>

        <p>
            Created by Anshu Sharma as part of the Cloud and DevOps
            learning journey.
        </p>

        <div class="status">Webhook Pipeline Successful</div>
    </main>
</body>
</html>
