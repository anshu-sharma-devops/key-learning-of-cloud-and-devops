<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Phase 2</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #ffffff;
            background: linear-gradient(135deg, #111827, #1e3a8a);
        }

        .container {
            max-width: 700px;
            padding: 50px;
            text-align: center;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid #60a5fa;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #60a5fa;
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: #ffffff;
            background: #f97316;
            border-radius: 20px;
            font-weight: bold;
        }

        p {
            line-height: 1.7;
            color: #d1d5db;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Jenkins Phase 2</h1>

        <h2>Freestyle CI Job with GitHub</h2>

        <p>
            This application has been updated to test whether Jenkins
            detects an unexpected code change.
        </p>

        <p>
            Jenkins should reject this version because the expected
            validation text has been removed.
        </p>

        <div class="status">Deployment Successful</div>
    </main>
</body>
</html>
