<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jenkins Phase 3</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background: linear-gradient(135deg, #0f172a, #312e81);
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 50px;
            text-align: center;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #818cf8;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin-bottom: 10px;
            color: #818cf8;
        }

        h2 {
            margin-bottom: 25px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .pipeline {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 35px 0;
        }

        .stage {
            padding: 12px 18px;
            color: #ffffff;
            background: #4338ca;
            border: 1px solid #a5b4fc;
            border-radius: 10px;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 12px 24px;
            color: #052e16;
            background: #4ade80;
            border-radius: 999px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Jenkins Phase 3</h1>

        <h2>Declarative Pipeline with Jenkinsfile</h2>

        <p>
            This application is validated through a Jenkins Pipeline
            stored as code inside GitHub.
        </p>

        <div class="pipeline">
            <span class="stage">Checkout</span>
            <span class="stage">Validate</span>
            <span class="stage">Test</span>
            <span class="stage">Summary</span>
        </div>

        <p>
            Created by Anshu Sharma as part of the Cloud and DevOps
            learning journey.
        </p>

        <div class="status">Pipeline Successful</div>
    </main>
</body>
</html>
